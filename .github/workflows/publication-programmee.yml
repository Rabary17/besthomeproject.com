name: Publication programmée

# Chaque nuit, un commit vide est poussé sur main : Vercel reconstruit le site
# et les articles dont la date arrive ce jour-là deviennent visibles.
# Pas de secret requis (le push utilise le jeton GITHUB_TOKEN du dépôt).

on:
  schedule:
    # 21:05 UTC, soit 00:05 à Antananarivo.
    - cron: "5 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relancer-deploiement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit vide sur main (déclenche le build Vercel)
        run: |
          git config user.name "publication-programmee[bot]"
          git config user.email "publication-programmee@besthomeproject.com"
          git commit --allow-empty -m "chore: publication programmée du jour (rebuild)"
          git push origin HEAD:main
